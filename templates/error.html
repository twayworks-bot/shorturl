<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ status_code }} - ShortURL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full rounded-2xl bg-slate-900 border border-slate-800 p-8 text-center shadow-2xl space-y-5">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-2xl font-extrabold">
            {{ status_code }}
        </div>
        <h1 class="text-xl font-bold text-white">{{ title }}</h1>
        <p class="text-sm text-slate-400 leading-relaxed">{{ message }}</p>
        <div class="pt-2">
            <a href="{{ base_prefix or '/' }}" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-semibold transition">
                대시보드로 돌아가기
            </a>
        </div>
    </div>
</body>
</html>
